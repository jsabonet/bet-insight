{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size:22px;color:#111827;margin:0 0 12px;">Senha alterada</h1>
<p style="font-size:15px;color:#374151;line-height:1.6;margin:0 0 16px;">
  Olá, {{ user_name }}, a senha da sua conta {{ site_name }} foi alterada com sucesso.
</p>
<p style="font-size:15px;color:#374151;line-height:1.6;margin:0;">
  Se não foi você quem fez esta alteração, contacte imediatamente o suporte:
  <a href="mailto:{{ support_email }}" style="color:#16a34a;">{{ support_email }}</a>.
</p>
{% endblock %}
