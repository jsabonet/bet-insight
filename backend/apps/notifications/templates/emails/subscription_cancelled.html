{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size:22px;color:#111827;margin:0 0 12px;">Assinatura cancelada</h1>
<p style="font-size:15px;color:#374151;line-height:1.6;margin:0 0 16px;">
  Olá, {{ user_name }}, a sua assinatura <strong>{{ plan_name }}</strong> foi cancelada.
</p>
<p style="font-size:15px;color:#374151;line-height:1.6;margin:0 0 24px;">
  Lamentamos vê-lo partir. Pode continuar a usar o plano gratuito ou reativar a
  sua assinatura premium quando quiser.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0;">
  <tr>
    <td style="background-color:#16a34a;border-radius:8px;">
      <a href="{{ site_url }}/premium" style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;">Reativar assinatura</a>
    </td>
  </tr>
</table>
{% endblock %}
