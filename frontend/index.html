<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PlacarCerto - Análises inteligentes de futebol com IA para partidas e desempenho" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlacarCerto" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>PlacarCerto - Análises de Futebol com IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker - APENAS EM PRODUÇÃO
      if ('serviceWorker' in navigator) {
        // Detectar se está em desenvolvimento
        const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        if (isDev) {
          // DESENVOLVIMENTO: Desregistrar TODOS os service workers
          window.addEventListener('load', async () => {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              console.log('🗑️ [DEV] Desregistrando SW...');
              await registration.unregister();
            }
            console.log('✅ [DEV] Modo desenvolvimento - SW desabilitado');
          });
        } else {
          // PRODUÇÃO: Registrar service worker normalmente
          window.addEventListener('load', async () => {
            try {
              console.log('✅ Registrando SW...');
              const registration = await navigator.serviceWorker.register('/sw.js', {
                updateViaCache: 'none'
              });
              
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    console.log('🎉 Novo SW ativado!');
                  }
                });
              });
              
              console.log('✅ SW registrado com sucesso');
            } catch (err) {
              console.error('❌ Erro no SW:', err);
            }
          });
        }
      }
    </script>
  </body>
</html>
