    <script>
      // Service Worker - APENAS EM PRODUÇÃO
      if ('serviceWorker' in navigator) {
        // Detectar se está em desenvolvimento
        const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        if (isDev) {
          // DESENVOLVIMENTO: Desregistrar TODOS os service workers
          window.addEventListener('load', async () => {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              console.log('🗑️ [DEV] Desregistrando SW...');
              await registration.unregister();
            }
            console.log('✅ [DEV] Modo desenvolvimento - SW desabilitado');
          });
        } else {
          // PRODUÇÃO: Registrar service worker normalmente
          window.addEventListener('load', async () => {
            try {
              console.log('✅ Registrando SW...');
              const registration = await navigator.serviceWorker.register('/sw.js', {
                updateViaCache: 'none'
              });
              
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    console.log('🎉 Novo SW ativado!');
                  }
                });
              });
              
              console.log('✅ SW registrado com sucesso');
            } catch (err) {
              console.error('❌ Erro no SW:', err);
            }
          });
        }
      }
    </script>
