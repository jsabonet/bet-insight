# Servidor HTTP "catch-all" da porta 80.
#
# POLITICA: negar por omissao.
# Este bloco responde apenas a duas coisas:
#   1. o desafio ACME do Let's Encrypt (necessario para emitir/renovar);
#   2. /health, usado pelo healthcheck do docker-compose e por monitorizacao.
#
# Qualquer outro pedido -- incluindo o acesso directo pelo IP do droplet
# (http://161.35.78.250/) -- e FECHADO sem resposta (444). A aplicacao so
# existe no bloco HTTPS gerado por scripts/setup-ssl.sh, que responde
# exclusivamente ao dominio configurado.
server {
    listen 80 default_server;
    server_name _;

    # Certbot challenge. `^~` impede que seja capturado pelas expressoes
    # regulares e mantem o pedido fora dos logs.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Health check (resposta estatica, sem expor a aplicacao).
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Tudo o resto: fecha a ligacao TCP sem enviar nenhuma resposta HTTP.
    location / {
        return 444;
    }
}

# NOTA: nao ha `proxy_pass` nem `upstream` neste ficheiro de proposito. Se a
# aplicacao fosse servida em HTTP, qualquer pessoa a acederia pelo IP, o que
# anula o objectivo de ter o site apenas no dominio. Os upstreams vivem no
# ssl.conf gerado por scripts/setup-ssl.sh.

