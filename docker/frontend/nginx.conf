server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao expor a versao do nginx.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Configuracao de runtime (gerada no arranque do container pelo
    # entrypoint.sh). Tem de ser sempre revalidada: se caísse na regra de
    # cache de *.js abaixo, o browser guardaria o URL da API durante 1 ano.
    # O match exato tem prioridade sobre as localizacoes regex.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Service Worker - nao fazer cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # O HTML aponta para chunks com hash e deve ser sempre revalidado.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Manifest e favicon
    location ~* \.(webmanifest|json)$ {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Cache static assets (hashed pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
